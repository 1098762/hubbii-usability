function shell(content,active='home'){let user=state.user;$('#app').innerHTML=`<aside class="sidebar"><a href="#/" class="logo"><span class="logo-mark">${icon('people',24)}</span>hubbii<span class="logo-dot">.</span></a><span class="sidebar-caption">一起，讓想法成真</span><nav aria-label="主導航">${[['home','/','總覽'],['compass','/explore','探索'],['people','/mine','我的社群'],['user','/profile','我的']].map(([i,p,n])=>link(p,icon(i)+n,active===i?'nav-link active':'nav-link')).join('')}</nav><div class="sidebar-note"><div class="mini-leaf">${icon('leaf',25)}</div><strong>一個想法，一群夥伴。</strong><p>讓你的下一個小目標，<br>從這裡開始。</p>${link('/create',icon('plus',16)+'建立社群','btn outline')}</div><a href="#/profile" class="sidebar-user"><span class="avatar">${user.slice(1)}</span><span><b>${user}</b><small>我的個人帳號</small></span>${icon('arrow',16)}</a></aside><div class="app-main"><header class="topbar"><span class="topbar-brand">Hubbii <span>/ 共學日常</span></span><div class="topbar-right"><span class="today">${state.date.replaceAll('-',' / ')}</span>${link('/','待辦 '+icon('bell',18),'notification')}<a href="#/profile" class="avatar small" aria-label="${user}的帳號">${user.slice(1)}</a></div></header><main id="main" tabindex="-1">${content}</main><footer class="footer">Hubbii · 找到夥伴，一起完成想做的事。</footer></div><nav class="mobile-nav" aria-label="手機主導航">${[['home','/','總覽'],['compass','/explore','探索'],['people','/mine','我的社群'],['user','/profile','我的']].map(([i,p,n])=>link(p,icon(i)+`<span>${n}</span>`,active===i?'active':'')).join('')}</nav>`;renderQA();}
function heading(kicker,title,sub='',actions=''){return `<div class="page-heading"><div><p class="eyebrow">${kicker}</p><h1>${title}</h1>${sub?`<p class="subtitle">${sub}</p>`:''}</div>${actions}</div>`}
function task(type,title,sub,route,action){return `<a href="#${route}" class="task"><span class="task-icon">${icon(type,22)}</span><span><strong>${title}</strong><small>${sub}</small></span><span class="task-action">${action} ${icon('arrow',16)}</span></a>`}
function home(){let mine=all().filter(related),tasks=[];if(state.user==='陳立安'){if(state.invitation==='待回覆')tasks.push(task('people','你收到一份分享邀請','許文哲邀請你在 AI 剪輯技巧交流週分享','/invitation','查看邀請'));if(state.invitation==='已接受')tasks.push(task('calendar','準備你的下一場分享',`12/12 20:00 · AI 剪輯技巧交流週 · ${state.planStatus}`,'/work/C02','繼續準備'));let n=applicants.filter(a=>!state.applications[a.name]).length;if(n)tasks.push(task('user',`${n} 位夥伴等待你的審核`,'從素材到短片｜AI 影片創作交流','/manage/C01','查看申請'));}else if(state.application==='已錄取')tasks.push(task('check','你已成功加入這個社群！','從素材到短片｜AI 影片創作交流 · 12/10 開始','/space/C01','查看社群空間'));else if(state.application==='待審核')tasks.push(task('clock','申請已送出，等待主理人審核','從素材到短片｜AI 影片創作交流','/community/C01','查看申請'));
shell(`${heading('YOUR LEARNING, TOGETHER',`${state.user.slice(1)}，你好。`, '每一個小進展，都值得一起分享。',link('/create',icon('plus',18)+'建立社群','btn outline'))}<section class="welcome"><div><span class="pill">有目標 · 有期限 · 有成果</span><h2>找到夥伴，<br>一起完成想做的事。</h2><p class="welcome-lead">Hubbii 不是只聊天的群組。<strong>每個社群都有清楚的目標和起迄時間</strong>；你可以跟著分享者練習、交換技巧，或與小隊一起完成作品。</p>${link('/explore','探索共學社群 '+icon('arrow',18),'btn primary')}</div><div class="hero-art" aria-hidden="true"><div class="orbit"></div><div class="hero-note note-one"><span>YOUR NEXT CHAPTER</span><b>小小的開始，<br>大大的可能。</b><div class="note-lines"></div></div><div class="hero-note note-two">${icon('check',22)}<b>一起完成</b><span>one step at a time</span></div><span class="hero-flower">✳</span><div class="hero-people"><i>安</i><i>芸</i><i>涵</i><span>＋ 你</span></div></div></section><div class="dashboard-grid"><section><div class="section-heading"><h2>接下來的事 <span class="count">${tasks.length}</span></h2><span class="subtle">一步一步，一起前進</span></div><div class="panel task-panel">${tasks.length?tasks.join(''):`<div class="empty compact"><span class="empty-icon">${icon('leaf',28)}</span><h3>新的共學旅程，等你開始</h3><p>目前沒有待辦事項。找個感興趣的社群吧。</p>${link('/explore','去探索 '+icon('arrow',16),'text-link')}</div>`}</div></section><section><div class="section-heading"><h2>我的共學</h2>${link('/mine','查看全部 '+icon('arrow',15),'text-link')}</div><div class="panel mini-communities">${mine.length?mine.slice(0,3).map(c=>`<a class="mini-community" href="#${roles(c).length?'/space/':'/community/'}${c.id}"><span class="community-symbol">${icon(c.art==='photo'?'compass':'people',22)}</span><span><b>${esc(c.name)}</b><small>${roles(c).join('、')||applicationStatus(c)} · ${c.id==='C06'&&!state.published?'草稿':life(c)}</small></span>${icon('arrow',16)}</a>`).join(''):`<p class="subtle">你的社群會在這裡集合。</p><p>把一個人的想法，<br>變成一起前進的日常。</p>${link('/explore','尋找我的夥伴 '+icon('arrow',16),'text-link')}`}</div></section></div>${typeNavigator(true)}<section class="explore-home"><div class="section-heading"><div><p class="eyebrow">FIND YOUR PEOPLE</p><h2>下一段共學，從這裡開始</h2></div>${link('/explore','探索全部 '+icon('arrow',16),'text-link')}</div><div class="card-grid">${publicList().slice(0,3).map(card).join('')}</div></section>`)}
const select=(name,label,options,value='',extra='')=>`<label class="field"><span>${label}</span><select name="${name}" ${extra}><option value="">全部${label}</option>${options.map(o=>{let [v,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${value===v?'selected':''}>${esc(t)}</option>`}).join('')}</select></label>`;
function filtered(list,f){return list.filter(c=>(!f.q||[c.name,c.topic,c.summary].join(' ').toLowerCase().includes(f.q.toLowerCase()))&&(!f.topic||c.topic===f.topic)&&(!f.type||c.type===f.type)&&(!f.level||c.level===f.level)&&(!f.mode||c.mode===f.mode)&&(!f.start||c.start>=f.start)&&(!f.end||c.end<=f.end)&&(!f.days||duration(c)===Number(f.days))&&(!f.role||roles(c).includes(f.role))&&(!f.status||recruitment(c)===f.status||life(c)===f.status||(c.id==='C01'&&state.application===f.status)))}
function resultHTML(mine=false){const f=mine?myFilters:filters,list=filtered(mine?all().filter(related):publicList(),f);let labels={q:'關鍵字',topic:'主題',type:'社群類型',level:'程度',mode:'參與方式',start:'可參與起日',end:'可參與迄日',days:'天數',role:'身分',status:'狀態'};return `<div class="results-top"><span>共 <strong>${list.length}</strong> 個社群</span><span class="subtle">${mine?'與你有關的每一段共學':'找到適合自己的步調'}</span></div><div class="filter-chips">${Object.entries(f).filter(([k,v])=>v).map(([k,v])=>btn(`${labels[k]}：${esc(TYPES[v]||v)} ×`,'clear-filter:'+k,'chip')).join('')}</div>${list.length?`<div class="card-grid">${list.map(card).join('')}</div>`:`<div class="panel empty">${icon('search',36)}<h2>還沒有符合條件的社群</h2><p>試試不同關鍵字，或放寬一些篩選條件。</p>${btn('清除全部條件','clear-filters','outline')}</div>`}`}
function explore(mine=false){let f=mine?myFilters:filters;shell(`${heading(mine?'MY COMMUNITIES':'EXPLORE & CONNECT',mine?'我的社群':'探索適合你的共學社群',mine?'你的參與、分享與發起，都在這裡。':'找到感興趣的主題，和夥伴一起練習、交流、完成。',mine?link('/create',icon('plus',18)+'建立社群','btn primary'):'')}${mine?'':typeNavigator()}<section class="search-panel"><form id="search-form"><div class="search-row"><div class="search-box">${icon('search',21)}<input name="q" aria-label="搜尋社群" placeholder="${mine?'搜尋我的社群名稱或主題':'搜尋社群名稱或感興趣的主題'}" value="${esc(f.q||'')}"></div><button class="btn primary">搜尋</button></div><details class="filters" open><summary>篩選條件 <span>＋</span></summary><div class="filter-grid">${select('topic','主題',[...new Set(publicList().map(c=>c.topic))].sort((a,b)=>a.localeCompare(b,'zh-Hant')),f.topic)}${select('type','社群類型',Object.entries(TYPES),f.type)}${select('level','程度',['初學者','有基礎','進階'],f.level)}${select('mode','參與方式',['個人實作','分組合作'],f.mode)}<label class="field"><span>可參與起日</span><input name="start" type="date" value="${f.start||''}" aria-label="可參與起日"></label><label class="field"><span>可參與迄日</span><input name="end" type="date" value="${f.end||''}" aria-label="可參與迄日"></label>${select('days','活動天數',[...new Set(publicList().map(duration))].sort((a,b)=>a-b).map(d=>[String(d),`${d} 天`]),f.days)}${mine?select('role','身分',['主理人','分享者','學習者'],f.role):select('status','招募狀態',['招募中','招募已截止','招募未開放'],f.status)}</div><div class="filter-bottom"><small>日期範圍包含起迄日；只顯示完整落在期間內的社群。</small>${btn('清除全部','clear-filters','text', 'type="button"')}</div><p id="filter-error" class="error" role="alert"></p></details></form></section><div id="results">${resultHTML(mine)}</div>`,mine?'people':'compass');if(innerWidth<700)$('.filters').open=false;}
function schedule(c){return `<div class="timeline">${c.schedule.map((s,i)=>{let d=new Date(c.start+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+i);return `<div class="timeline-item"><span class="day-number">${String(i+1).padStart(2,'0')}</span><div><span class="day-date">${md(d.toISOString().slice(0,10))} · DAY ${i+1}</span><p>${esc(s)}</p>${c.id==='C01'&&i===0&&roles(c).length?btn('查看參與資訊','meeting','text'):''}</div></div>`}).join('')}</div>${c.scheduleNote?`<p class="subtle">${c.scheduleNote}</p>`:''}`}
function community(id){let c=get(id);if(!c||(id==='C06'&&!state.published&&!roles(c).includes('主理人')))return missing();let r=roles(c),status=recruitment(c),applied=applicationStatus(c);let action=r.length?link('/space/'+id,'查看社群空間 '+icon('arrow',18),'btn primary wide'):applied==='待審核'?`<div class="notice">申請已送出，等待主理人審核</div>`:status==='招募中'?btn('申請加入','apply:'+id,'primary wide'):btn(status,'noop','outline wide','disabled');shell(`<a class="back" href="#/explore">${icon('back',16)} 返回探索</a><div class="detail-cover">${art(c,true)}<div><div class="card-tags">${tag(c.topic)}${tag(TYPES[c.type])}${tag(status,'green')}${tag(life(c))}</div><h1>${esc(c.name)}</h1><p>${esc(c.summary)}</p><div class="personal-tags">${personal(c)}</div></div></div><div class="detail-grid"><div class="detail-content"><section class="panel"><p class="eyebrow">ABOUT THIS COMMUNITY</p><h2>關於這段共學</h2><div class="model-explain"><span class="tag green">${TYPES[c.type]}</span><h3>${TYPE_GUIDE[c.type].headline}</h3><p>${TYPE_GUIDE[c.type].detail}</p><div class="model-stats"><div class="model-stat"><small>帶領與分享</small><b>${esc(c.speaker)}</b></div><div class="model-stat"><small>參與方式</small><b>${esc(c.format)} · ${esc(c.mode)}</b></div><div class="model-stat"><small>要完成的成果</small><b>${esc(c.goal)}</b></div></div></div><p>${esc(c.intro)}</p><div class="goal"><span>${icon('check',22)}</span><div><b>一起完成的目標</b><p>${esc(c.goal)}</p></div></div></section><section class="panel"><h2>${duration(c)} 天的共學安排</h2><p class="subtle">同步相聚，也留一些時間自己練習。</p>${schedule(c)}</section><section class="panel"><h2>參加前，先了解</h2><h3>適合這樣的你</h3><p>${esc(c.qualification)}</p><h3>需要準備</h3><p>${esc(c.prepare)}</p><h3>陪你一起的人</h3><div class="hosts"><div><span class="avatar">${c.owner.slice(1)}</span><span><small>主理人</small><b>${c.owner}</b></span></div><div><span class="avatar sand">${c.speaker.length<5?c.speaker.slice(1):'共學'}</span><span><small>分享者</small><b>${c.speaker}</b></span></div></div></section></div><aside class="panel detail-aside"><h3>留一段時間，給新的可能</h3><dl><dt>共學日期</dt><dd>${md(c.start)}—${md(c.end)}<small>2026 年 · 共 ${duration(c)} 天</small></dd><dt>參與方式</dt><dd>${c.format} · ${c.mode}</dd><dt>適合程度</dt><dd>${c.level}</dd><dt>社群名額</dt><dd>${c.capacity} 人</dd><dt>報名截止</dt><dd>${md(c.deadline)} 23:59</dd>${c.free?'<dt>參與費用</dt><dd>免費</dd>':''}</dl>${action}${r.includes('主理人')?link('/manage/'+id,'管理社群','btn outline wide'):''}${r.includes('分享者')?link('/work/'+id,'前往分享工作區','btn outline wide'):''}${id==='C02'&&state.user==='陳立安'?link('/invitation','查看分享邀請','text-link'):''}${!r.length?'<p class="fine">提交申請後，將由主理人審核。<br>報名結果可至「我的社群」查看。</p>':''}</aside></div>`,'compass')}
function space(id){let c=get(id),r=c&&roles(c);if(!c||!r.length)return denied();shell(`${link('/mine',icon('back',16)+'返回我的社群','back')}${heading('OUR COMMUNITY',esc(c.name),`${md(c.start)}—${md(c.end)} · ${life(c)}`)}<div class="workspace-banner"><div>${personal(c)}</div><div class="actions">${r.includes('主理人')?link('/manage/'+id,'管理社群','btn outline'):''}${r.includes('分享者')?link('/work/'+id,'分享工作區 '+icon('arrow',18),'btn primary'):''}${id==='C02'&&state.user==='陳立安'?link('/invitation','查看分享邀請','btn outline'):''}</div></div>${life(c)==='已結束'?'<div class="notice">這段共學已結束，公告、日程與準備內容保留供你回顧。</div>':''}<div class="tabs">${['公告','日程','準備事項','資源'].map(t=>btn(t,'tab:'+t,spaceTab===t?'tab active':'tab')).join('')}</div><div class="space-grid"><section class="panel">${spaceTab==='公告'?`<div class="article-meta">${tag('置頂公告','green')}<span>${c.owner} · 主理人</span></div><h2>${id==='C01'?'歡迎加入！開始前請先完成三件事':'歡迎加入，一起開始這段共學'}</h2>${id==='C01'?'<p>很開心接下來能和大家一起創作。在第一次相聚前，先完成以下準備：</p><ol class="prep-list"><li><b>檢查設備</b><p>檢查電腦與網路、視訊／聚會工具。</p></li><li><b>想一個影片主題</b><p>選一個有興趣的方向，無須寫完劇本。</p></li><li><b>整理可用素材</b><p>整理可自由使用的圖片或文字素材，沒有也沒關係。</p></li></ol><div class="notice">第一次同步活動：12/10 19:30<br>參與入口可在社群日程內查看。</div>':`<p>${esc(c.intro)}</p><div class="notice">${esc(c.prepare)}</div>`}`:spaceTab==='日程'?`<h2>完整共學日程</h2>${schedule(c)}`:spaceTab==='準備事項'?`<p class="eyebrow">BEFORE WE START</p><h2>開始前，準備好這些</h2><p>${esc(c.prepare)}</p><h3>參與條件</h3><p>${esc(c.qualification)}</p><h3>預計成果</h3><p>${esc(c.goal)}</p>`:`<h2>社群資源</h2><p class="subtle">共學資料與補充內容會集中在這裡。</p><div class="resource-row">${icon('calendar',24)}<span><b>活動安排與參與準備</b><small>查看每天的內容與準備事項</small></span>${btn('查看','tab:日程','outline')}</div><div class="empty compact"><p>尚無其他共用資源。</p></div>`}</section><aside class="panel space-aside"><span class="mini-leaf">${icon('leaf',28)}</span><h3>一起，慢慢完成。</h3><p>${esc(c.goal)}</p><hr><span class="subtle">社群身分</span><div class="personal-tags">${r.map(x=>tag(x,'green')).join('')}</div><p class="subtle">主理人 · ${c.owner}<br>分享者 · ${c.speaker}</p></aside></div>`,'people')}
function invitation(){if(state.user!=='陳立安')return denied();shell(`${link('/',icon('back',16)+'返回總覽','back')}${heading('AN INVITATION TO SHARE','一起分享你的經驗','每個人的小方法，都可能成為夥伴的新靈感。')}<div class="narrow panel invitation-panel"><div class="invite-icon">${icon('people',30)}</div><div class="card-tags">${tag('輪值分享邀請')}${tag(state.invitation,state.invitation==='待回覆'?'amber':'green')}</div><h2>我的 AI 短片剪輯流程</h2><p class="subtitle">AI 剪輯技巧交流週</p><div class="invite-from"><span class="avatar">文哲</span><span><b>許文哲</b><small>邀請你擔任這場分享的分享者</small></span></div><div class="notice">${inviteText}</div><dl class="info-grid"><div><dt>分享日期</dt><dd>2026/12/12</dd></div><div><dt>分享時間</dt><dd>20:00–20:40</dd></div><div><dt>分享形式</dt><dd>線上・輪值分享</dd></div><div><dt>你在社群的身分</dt><dd>${state.invitation==='已接受'?'學習者、分享者':'學習者'}</dd></div></dl>${state.invitation==='待回覆'?`<div class="actions">${btn('接受邀請','accept-invite')}${btn('婉拒邀請','decline-invite','outline')}</div>`:`<div class="notice success">${state.invitation==='已接受'?'你已接受這場分享邀請，學習者身分也會保留。':'你已婉拒這場分享邀請，仍可作為學習者參與社群。'}</div>${state.invitation==='已接受'?link('/work/C02','前往分享工作區 '+icon('arrow',16),'btn primary'):link('/space/C02','查看社群空間','btn outline')}`}</div>`)}
function textfield(name,label,val,required=false,area=false,hint=''){return `<label class="field"><span>${label}${required?' <em>*</em>':''}</span>${area?`<textarea name="${name}" rows="${name==='flow'?5:3}" ${required?'required':''} placeholder="${esc(hint)}">${esc(val)}</textarea>`:`<input name="${name}" value="${esc(val)}" ${required?'required':''} placeholder="${esc(hint)}">`}</label>`}
function work(id){if(id!=='C02'||!roles(get(id)).includes('分享者'))return denied();let p=state.plan,locked=state.planStatus!=='草稿';shell(`${link('/space/C02',icon('back',16)+'返回社群空間','back')}${heading('SHARING WORKSPACE','把你的方法，分享給夥伴','AI 剪輯技巧交流週',tag(state.planStatus,locked?'green':'amber'))}<div class="detail-grid"><section class="panel"><h2>分享規劃</h2><p class="subtle">先記下想法，再整理成讓夥伴容易理解的流程。</p>${locked?'<div class="notice success">規劃已提交，等待主理人確認。你可以回來查看提交內容。</div>':''}<form id="plan-form"><fieldset ${locked?'disabled':''}>${textfield('title','分享標題',p.title,true,false,'為這次分享取一個清楚的名字')}${textfield('summary','分享摘要',p.summary,true,true,'夥伴可以從這次分享學到什麼？')}${textfield('flow','分享流程',p.flow,true,true,'依序說明開場、示範與交流內容')}${textfield('tools','工具與資源',p.tools,true,true,'預計使用的工具、連結或素材')}${textfield('notes','備註',p.notes,false,true,'其他希望主理人知道的事情')}</fieldset>${locked?'':`<div class="form-actions">${btn('儲存草稿','save-plan','outline','type="button"')}<button class="btn primary" type="submit">提交主理人確認</button></div>`}<p class="fine" id="plan-saved">${state.planSaved?'草稿已儲存，可稍後回來繼續編輯。':''}</p></form></section><aside class="panel detail-aside"><span class="eyebrow">YOUR SESSION</span><h3>我的 AI 短片剪輯流程</h3><div class="session-date">${icon('calendar',22)}<b>12/12<br><span>20:00–20:40</span></b></div><hr><h3>主理人的分享要求</h3><p>${inviteText}</p><div class="personal-tags">${tag('學習者','green')}${tag('分享者','green')}</div><p class="fine">提交後，將由主理人確認分享內容。</p></aside></div>`,'people')}
function manage(id){let c=get(id);if(!c||!roles(c).includes('主理人'))return denied();if(id==='C06')return create();let count=6+Object.values(state.applications).filter(s=>s==='已錄取').length,n=applicants.filter(a=>!state.applications[a.name]).length;shell(`${link('/space/'+id,icon('back',16)+'返回社群空間','back')}${heading('COMMUNITY MANAGEMENT','讓合適的夥伴一起加入',esc(c.name))}<div class="stat-grid"><div class="stat"><span>社群總名額</span><b>8 <small>人</small></b></div><div class="stat"><span>已錄取</span><b>${count} <small>人</small></b></div><div class="stat"><span>剩餘名額</span><b>${8-count} <small>人</small></b></div><div class="stat"><span>待審核</span><b>${n} <small>份申請</small></b></div></div><section class="panel"><div class="section-heading"><h2>報名申請</h2>${tag(recruitment(c),'green')}</div><p class="subtle">閱讀申請者的目標與參與情況，再決定是否錄取。</p>${count===8?'<div class="notice">名額已滿，無法繼續錄取。仍可查看申請與處理未錄取結果。</div>':''}<div class="applicant-list">${applicants.map((a,i)=>`<div class="applicant-row"><span class="avatar ${i%2?'sand':''}">${a.name.slice(1)}</span><div class="applicant-main"><b>${a.name}</b><p>${a.goal}</p><small>${a.availability}</small></div>${tag(state.applications[a.name]||'待審核',state.applications[a.name]==='已錄取'?'green':'amber')}${btn('查看申請','applicant:'+i,'outline')}</div>`).join('')}</div></section><section class="panel slim"><div><h3>活動狀態</h3><p>${life(c)} · ${recruitment(c)}</p></div>${state.date>='2026-12-16'&&!state.ended?btn('將社群設為已結束','end-community','outline'):''}</section>`,'people')}
function create(){if(state.user!=='陳立安'){shell(`${heading('START SOMETHING TOGETHER','建立一段新的共學')}<div class="panel narrow"><h2>從一個小目標開始</h2><p>這個帳號尚未建立社群草稿。請使用已具備草稿的主理人帳號繼續。</p>${link('/','返回總覽','btn outline')}</div>`);return}let c=get('C06');shell(`${link('/mine',icon('back',16)+'返回我的社群','back')}${heading('CREATE A COMMUNITY','手機攝影七天練習', '為夥伴準備一段有方向的共學時光。',tag(state.published?'已發布':'草稿',state.published?'green':'amber'))}<div class="detail-grid"><section class="panel"><h2>社群基本資料</h2><form id="draft-form">${textfield('name','社群名稱',c.name,true)}<div class="two-col">${textfield('topic','主題',c.topic,true)}<label class="field"><span>社群類型</span><input value="興趣社群" readonly></label></div><div class="two-col"><label class="field"><span>開始日期</span><input type="date" name="start" value="${c.start}" required></label><label class="field"><span>結束日期</span><input type="date" name="end" value="${c.end}" required></label></div>${textfield('summary','社群摘要',c.summary,true,true)}${textfield('prepare','準備事項',c.prepare,true,true)}<p class="error" id="draft-error" role="alert"></p><div class="form-actions"><button class="btn primary">儲存${state.published?'變更':'草稿'}</button></div>${state.draftSaved?'<p class="notice success">草稿內容已儲存。</p>':''}</form></section><aside><section class="panel"><h3>邀請分享者</h3><p class="subtle">由固定分享者陪伴夥伴練習。</p><div class="invite-from"><span class="avatar sand">宛庭</span><span><b>鄭宛庭</b><small>${state.c06Invite}</small></span></div>${state.c06Invite==='尚未邀請'?btn('邀請鄭宛庭','invite-c06','outline wide'):tag(state.c06Invite,state.c06Invite==='已接受'?'green':'amber')}</section><section class="panel"><h3>準備好和大家見面了嗎？</h3><p class="subtle">目標：${c.goal}</p><p class="fine">${c.capacity} 人 · 線上個人實作<br>報名截止 ${md(c.deadline)} 23:59</p>${state.published?`<div class="notice success">社群已發布，可在探索頁找到。</div>${link('/community/C06','查看公開社群','btn outline wide')}`:`${btn('發布社群','publish-c06','primary wide')}<p class="fine">${state.c06Invite==='已接受'?'分享者已接受邀請，可發布社群。':'分享者接受邀請後，才能發布社群。'}</p>`}</section></aside></div>`,'people')}
function profile(){shell(`${heading('MY PROFILE','我的','每一段共學，都是自己的新篇章。')}<section class="panel narrow"><div class="profile-header"><span class="avatar big">${state.user.slice(1)}</span><div><h2>${state.user}</h2><p class="subtle">Hubbii 共學夥伴</p></div></div><hr><h3>我的參與</h3><p>你可以在不同社群學習、分享或擔任主理人。各社群的身分會顯示在「我的社群」中。</p><div class="actions">${link('/mine','前往我的社群 '+icon('arrow',18),'btn primary')}${btn('切換帳號','switch-account','outline')}</div></section>`,'user')}
function denied(){shell(`${heading('COMMUNITY ACCESS','這個空間尚未對你開放')}<div class="panel empty"><p>只有具備此社群相應權限的成員，才能查看這項內容。</p>${link('/mine','返回我的社群','btn primary')}</div>`)}
function missing(){shell(`${heading('PAGE NOT FOUND','找不到這個社群')}<div class="panel empty"><p>這個社群可能尚未發布。</p>${link('/explore','返回探索','btn primary')}</div>`)}

function accountPicker(){
 document.title='歡迎回來｜Hubbii';
 $('#app').innerHTML=`<div class="account-page"><main class="account-card"><section class="account-intro"><div class="logo"><span class="logo-mark">${icon('people',24)}</span>hubbii<span class="logo-dot">.</span></div><p class="eyebrow">GOOD TO SEE YOU AGAIN</p><h1>歡迎回來</h1><p class="account-subtitle">選擇帳號，繼續你的共學旅程。</p><div class="account-flourish" aria-hidden="true">${icon('leaf',27)}<span>找到夥伴，<br>一起完成想做的事。</span></div></section><section class="account-options" aria-labelledby="account-title"><h2 id="account-title">選擇帳號</h2><div class="account-list">${[['learner','張雨彤',''],['organizer','陳立安','sand']].map(([id,name,color])=>`<button class="account-option" data-action="choose-account:${id}" aria-label="以${name}的帳號繼續"><span class="avatar ${color}">${name.slice(1)}</span><span class="account-name"><strong>${name}</strong><small>Hubbii 帳號</small></span>${icon('arrow',19)}</button>`).join('')}</div><p class="account-note">每段共學，都從一次相遇開始。</p></section></main><footer class="account-footer"><span>Hubbii</span><span>讓每一個小目標，都有人同行。</span><span>繁體中文</span></footer></div>`;
 renderQA();
}
function chooseAccount(account){
 const user=account==='learner'?'張雨彤':account==='organizer'?'陳立安':null;
 if(!user)return;
 save();
 const fallback=user==='張雨彤'?'learner-apply':'speaker-invite';
 let selected=localStorage.getItem('hubbii:account-scenario:'+user)||fallback;
 if(!scenarios[selected]||scenarios[selected][1]!==user)selected=fallback;
 scenario=selected;
 try{state=JSON.parse(localStorage.getItem('hubbii:'+scenario))||fixture(scenario)}catch{state=fixture(scenario)}
 if(state.user!==user)state=fixture(scenario);
 signedIn=true;filters={};myFilters={};spaceTab='公告';save();
 location.hash='/';route();window.scrollTo(0,0);
}

function route(){if(!signedIn||location.hash==='#/accounts')return accountPicker();document.title='Hubbii｜一起完成想做的事';let [page,id]=(location.hash.slice(1)||'/').split('/').filter(Boolean);if(page==='explore')explore();else if(page==='mine')explore(true);else if(page==='community')community(id);else if(page==='space')space(id);else if(page==='invitation')invitation();else if(page==='work')work(id);else if(page==='manage')manage(id);else if(page==='create')create();else if(page==='profile')profile();else home();}
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3200)}
function modal(title,html){let d=$('#dialog');d.innerHTML=`<div class="modal-head"><h2>${title}</h2><button class="icon-btn" data-action="close" aria-label="關閉對話框">×</button></div>${html}`;d.showModal();}
function openApply(id){let c=get(id);if(!c||recruitment(c)!=='招募中'||related(c))return;if(id!=='C01'){modal('申請加入社群',`<p class="subtle">${esc(c.name)}</p><div class="notice">${md(c.start)}—${md(c.end)} · ${c.mode}<br>${esc(c.qualification)}</div><form id="other-apply-form" data-community="${c.id}">${textfield('goal','希望完成什麼？','',true,true)}${textfield('experience','相關經驗','',true,true)}<label class="check-field"><input type="checkbox" required><span>已了解日期、參與方式與成果要求</span></label><div class="form-actions"><button class="btn primary">送出申請</button></div></form>`);return}modal('申請加入社群',`<p class="subtle">${c.name}</p><div class="notice">12/10–12/16 · 個人實作 · 約 60 秒影片<br>四場同步聚會與三天自主實作；申請需經主理人審核。</div><form id="apply-form">${textfield('goal','七天希望完成什麼？','',true,true,'描述你想完成的作品或學習目標')}<label class="field"><span>AI 影片經驗 <em>*</em></span><select name="experience" required><option value="">請選擇</option><option>沒有</option><option>試過幾次</option><option>曾完成作品</option></select></label>${textfield('topic','想嘗試的影片主題（選填）','')}<label class="check-field"><input type="checkbox" name="agree" required><span>已了解日期、個人實作與成果要求</span></label><div class="form-actions">${btn('取消','close','outline','type="button"')}<button class="btn primary" type="submit">送出申請</button></div></form>`)}
function applicant(i){if(state.user!=='陳立安')return;let a=applicants[i],status=state.applications[a.name],full=6+Object.values(state.applications).filter(x=>x==='已錄取').length>=8;modal(a.name+'的報名申請',`${tag(status||'待審核',status==='已錄取'?'green':'amber')}<dl class="application-info"><dt>想完成的作品／學習目標</dt><dd>${a.goal}</dd><dt>經驗</dt><dd>${a.experience}</dd><dt>可參與情況</dt><dd>${a.availability}</dd><dt>參與偏好</dt><dd>${a.preference}</dd></dl>${!status?`${full?'<div class="notice">社群名額已滿，無法繼續錄取。</div>':''}<div class="form-actions">${btn('不錄取','reject:'+i,'outline')}${btn('錄取','admit:'+i,'primary',full?'disabled':'')}</div>`:`<div class="notice">審核已完成：${status}</div>${btn('關閉','close','outline')}`}`)}
function renderQA(){if(!isQA){$('#qa').innerHTML='';return}$('#qa').innerHTML=`<div class="qa-panel">${btn('主持人測試工具 '+(qaOpen?'−':'+'),'toggle-qa','qa-toggle','aria-expanded="'+qaOpen+'"')}${qaOpen?`<div class="qa-body"><b>目前模擬人物：${state.user}</b><p>模擬日期：${state.date.replaceAll('-','/')}</p><p>目前情境：${scenarios[scenario][0]}</p><label class="field"><span>載入情境（固定快照）</span><select id="qa-scenario">${Object.entries(scenarios).map(([k,v])=>`<option value="${k}" ${k===scenario?'selected':''}>${v[0]}</option>`).join('')}</select></label>${btn('載入情境','load-scenario','primary wide')}${btn('重設此情境','reset-scenario','outline wide')}<label class="field"><span>跨日測試</span><select id="qa-date">${['2026-12-07','2026-12-08','2026-12-09','2026-12-10','2026-12-16','2026-12-17','2026-12-29'].map(d=>`<option ${d===state.date?'selected':''}>${d}</option>`).join('')}</select></label>${btn('套用日期','set-date','outline wide')}${state.user==='陳立安'?btn('模擬對方接受 C06 邀請','qa-accept-c06','outline wide',state.c06Invite!=='待回覆'?'disabled':''):''}<p class="fine">載入與重設會清除該情境操作並返回總覽。開始測試前請收合此面板。</p></div>`:''}</div>`}
function loadScenario(k){signedIn=true;scenario=k;state=fixture(k);filters={};myFilters={};spaceTab='公告';save();location.hash='/';route();window.scrollTo(0,0);toast('情境已載入，從總覽開始')}
document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(!el)return;let [a,v]=el.dataset.action.split(':');if(a==='choose-account')chooseAccount(v);else if(a==='filter-type'){e.preventDefault();filters.type=filters.type===v?'':v;location.hash='/explore';route();window.scrollTo(0,0)}else if(a==='switch-account'){save();signedIn=false;location.hash='/accounts';route()}else if(a==='close')$('#dialog').close();else if(a==='apply')openApply(v);else if(a==='accept-invite'){if(state.user!=='陳立安'||state.invitation!=='待回覆')return;state.invitation='已接受';save();route();toast('已接受分享邀請')}else if(a==='decline-invite')modal('婉拒這次分享邀請？',`<p>你仍會保有學習者身分，可以繼續參與社群。</p><div class="form-actions">${btn('再想一下','close','outline')}${btn('確認婉拒','confirm-decline')}</div>`);else if(a==='confirm-decline'){state.invitation='已婉拒';save();$('#dialog').close();route();toast('已婉拒分享邀請')}else if(a==='save-plan'){state.plan=Object.fromEntries(new FormData($('#plan-form')));state.planSaved=true;save();$('#plan-saved').textContent='草稿已儲存，可稍後回來繼續編輯。';toast('分享規劃草稿已儲存')}else if(a==='tab'){spaceTab=v;route()}else if(a==='applicant')applicant(Number(v));else if(a==='admit'||a==='reject'){let p=applicants[Number(v)];if(state.user!=='陳立安'||state.applications[p.name])return;if(a==='admit'&&6+Object.values(state.applications).filter(x=>x==='已錄取').length>=8){toast('名額已滿，無法繼續錄取');return}state.applications[p.name]=a==='admit'?'已錄取':'未錄取';save();$('#dialog').close();route();toast(`${p.name}：${state.applications[p.name]}`)}else if(a==='invite-c06'){state.c06Invite='待回覆';save();route();toast('已向鄭宛庭發出邀請')}else if(a==='publish-c06'){if(state.c06Invite!=='已接受'){modal('尚無法發布社群','<p>需要受邀分享者鄭宛庭接受邀請後，才能發布此興趣社群。</p>'+btn('知道了','close','outline'));return}if(!state.draftSaved){toast('請先儲存社群草稿');return}state.published=true;save();route();toast('社群已發布')}else if(a==='end-community'){state.ended=true;save();route();toast('社群已結束，內容保留為唯讀')}else if(a==='meeting')modal('第一次同步活動',`<p>12/10 19:30–20:30</p><p>破冰、AI 影片流程、主題與腳本</p><div class="notice">線上聚會連結將於活動開始前公布，請留意主理人公告。</div>${btn('知道了','close','outline')}`);else if(a==='clear-filters'){if(location.hash==='#/mine')myFilters={};else filters={};route()}else if(a==='clear-filter'){let f=location.hash==='#/mine'?myFilters:filters;delete f[v];route()}else if(a==='toggle-qa'&&isQA){qaOpen=!qaOpen;renderQA()}else if(a==='load-scenario'&&isQA)loadScenario($('#qa-scenario').value);else if(a==='reset-scenario'&&isQA)loadScenario(scenario);else if(a==='set-date'&&isQA){state.date=$('#qa-date').value;save();route()}else if(a==='qa-accept-c06'&&isQA&&state.c06Invite==='待回覆'){state.c06Invite='已接受';save();route();toast('C06 分享者已接受邀請')}});
document.addEventListener('submit',e=>{e.preventDefault();let f=e.target,v=Object.fromEntries(new FormData(f));if(f.id==='search-form')runSearch();if(f.id==='apply-form'){if(state.user!=='張雨彤'||state.application!=='未報名'||recruitment(get('C01'))!=='招募中')return;state.application='待審核';state.applicationForm=v;save();$('#dialog').close();route();toast('申請已送出，等待主理人審核')}if(f.id==='other-apply-form'){state.otherApplications||={};state.otherApplications[f.dataset.community]={status:'待審核',...v};save();$('#dialog').close();route();toast('申請已送出，等待主理人審核')}if(f.id==='plan-form'){if(!roles(get('C02')).includes('分享者'))return;state.plan=v;state.planStatus='待主理人確認';state.planSaved=true;save();route();toast('分享規劃已提交主理人確認')}if(f.id==='draft-form'){if(v.end<v.start||v.start<='2026-12-19'||duration(v)!==7){$('#draft-error').textContent='請設定報名截止 12/19 之後開始、共 7 天的日期。';return}state.draft={...state.draft,...v};state.draftSaved=true;save();route();toast('社群內容已儲存')}});
function runSearch(){let f=Object.fromEntries(new FormData($('#search-form')));if(f.start&&f.end&&f.start>f.end){$('#filter-error').textContent='可參與迄日不得早於起日。';return}$('#filter-error').textContent='';let mine=location.hash==='#/mine';if(mine)myFilters=f;else filters=f;$('#results').innerHTML=resultHTML(mine)}
document.addEventListener('change',e=>{if(e.target.closest('#search-form'))runSearch()});document.addEventListener('input',e=>{if(e.target.name==='q'&&e.target.closest('#search-form'))runSearch()});
window.addEventListener('hashchange',()=>{if($('#dialog').open)$('#dialog').close();route();window.scrollTo(0,0)});route();save();
</script></body></html>
